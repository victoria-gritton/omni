<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:#0a0e1a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}

.steps{display:flex;gap:6px;margin:12px 0 8px;justify-content:center}

<style>
/* WATCH with SVG mockup */

.wn-face{height:100%;display:flex;flex-direction:column}
.wn-time{font-size:51px;font-weight:200;color:#fff;text-align:center;padding-top:15px;letter-spacing:-1px}
.wn-date{font-size:12px;color:#555;text-align:center;margin-top:0;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px}
.wn-banner{margin:0 12px;background:rgba(255,59,48,0.1);border:1px solid rgba(255,59,48,0.18);border-radius:18px;padding:13px;cursor:pointer;transition:all 0.15s}

.wn-hdr{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.wn-icon{width:27px;height:27px;border-radius:7px;background:linear-gradient(135deg,#ff9500,#ff6b00);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.wn-app{font-size:12px;color:#ff9500;font-weight:600;text-transform:uppercase;letter-spacing:0.4px}
.wn-when{font-size:10px;color:#555;margin-left:auto}

.wa-pad{padding:12px 15px 18px}

.red{color:#ff3b30}.ylw{color:#ff9500}.grn{color:#30d158}

.w-gauge{display:flex;align-items:center;justify-content:space-around;margin:6px 6px 9px}

.w-gr .fg{fill:none;stroke-width:4;stroke-linecap:round}
.w-gv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1}
.w-gv .n{font-size:16px;font-weight:700;display:block}

.w-mc{height:42px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,0.02);margin-bottom:7px}
/* Stats */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:7px}
.wgs{background:rgba(255,255,255,0.04);border-radius:7px;padding:6px;text-align:center}
.wgs .vl{font-size:8px;color:#666;text-transform:uppercase;letter-spacing:0.3px}
.wgs .vv{font-size:15px;font-weight:700;margin-top:2px}
/* Agent box */
.wc{background:rgba(255,149,0,0.08);border-left:3px solid #ff9500;border-radius:6px;padding:6px 9px;margin-bottom:7px}

.wc .cl svg{width:13px;height:13px}

/* Buttons */
.wa-btns{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.btn{width:100%;padding:9px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-p{background:#0a84ff;color:#fff}
.btn-s{background:rgba(255,255,255,0.07);color:#ccc}
.btn:hover{filter:brightness(1.15)}
.lbl{font-size:11px;color:#888;margin:4px 0 3px;font-weight:600;text-transform:uppercase}
.ok{color:#30d158;font-size:13px;line-height:1.5}
.ok svg{width:12px;height:12px;vertical-align:middle;margin-right:3px}
/* Service health rows */
.w-svc{display:flex;align-items:center;gap:5px;font-size:12px;color:#aaa;margin-bottom:3px}
.w-svc .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.w-svc .s{margin-left:auto;font-weight:600;font-size:10px}
</style>
<style>

.d-icons .di.on{background:rgba(10,132,255,0.08);color:#0a84ff;border-left-color:#0a84ff}
.d-icons .di svg{width:15px;height:15px;flex-shrink:0}
.d-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.d-content{flex:1;overflow-y:auto;padding:20px 24px}
.d-content::-webkit-scrollbar{width:3px}
.d-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.d-chat{flex-shrink:0;padding:8px 24px 14px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02)}
.d-chat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.d-chat-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px}
.d-chat-bar input{flex:1;background:none;border:none;color:#fff;font-size:13px;outline:none}
.d-chat-bar input::placeholder{color:#444}
.d-chat-bar button{background:#0a84ff;border:none;border-radius:6px;padding:6px 12px;color:#fff;font-size:11px;font-weight:600;cursor:pointer}
/* Page title */
.d-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.d-subtitle{font-size:12px;color:#888;margin-bottom:16px;line-height:1.5}
/* Two column layout */
.d-cols{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px}
/* AI analysis card */
.ai-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.ai-label{font-size:11px;color:#f59e0b;font-weight:600;margin-bottom:8px}
.ai-text{font-size:12px;color:#ccc;line-height:1.7}
.ai-text strong{color:#fff}
.ai-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px}
.ai-meta .conf{padding:2px 8px;border-radius:4px;font-weight:600}
.ai-meta .conf-h{background:rgba(255,59,48,0.15);color:#ff6b6b}
.ai-meta .rc{color:#888}
.ai-meta .rc strong{color:#ff9500}
/* Auto-remediation */
.ai-remed{background:rgba(48,209,88,0.06);border:1px solid rgba(48,209,88,0.15);border-radius:8px;padding:12px;margin-top:10px}
.ai-remed .label{font-size:10px;color:#30d158;font-weight:600;margin-bottom:4px}
.ai-remed .desc{font-size:11px;color:#ccc;line-height:1.5}
.ai-remed .rbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#30d158;color:#000;border:none;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer}
.ai-remed .rbtn svg{width:12px;height:12px}
/* Service map */
.svc-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;backdrop-filter:blur(8px)}
.svc-card .label{font-size:11px;color:#888;font-weight:600;margin-bottom:12px}
.svc-map-d{position:relative;height:180px}
.svc-map-d .node{position:absolute;text-align:center}
.svc-map-d .node .ring{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:12px;font-weight:700;color:#fff}
.svc-map-d .node .nm{font-size:9px;color:#888}
.svc-map-d .connector{position:absolute;height:1px;background:#333;transform-origin:left center}
/* How AI reached conclusion */
.ai-steps{margin-bottom:16px}
.ai-steps .label{font-size:13px;font-weight:600;color:#fff;margin-bottom:12px}
.ai-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ai-step .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.ai-step .dot-g{background:#30d158}
.ai-step .dot-y{background:#ff9500}
.ai-step .step-title{font-size:12px;font-weight:600;color:#ddd}
.ai-step .step-desc{font-size:11px;color:#888;margin-top:1px}
/* Timeline */
.tl-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;backdrop-filter:blur(8px)}
.tl-card .label{font-size:11px;font-weight:600;color:#888;margin-bottom:12px}
.tl-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;position:relative;padding-left:4px}
.tl-item .tl-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0}
.tl-item .tl-time{font-size:9px;color:#ff9500;font-weight:600;min-width:42px;flex-shrink:0}
.tl-item .tl-text{font-size:11px;color:#ccc;line-height:1.4}

.sq{margin-top:12px}
.sq .label{font-size:12px;font-weight:600;color:#888;margin-bottom:8px}
.sq-chips{display:flex;flex-wrap:wrap;gap:6px}
.sq-chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:5px 12px;font-size:11px;color:#aaa;cursor:pointer;transition:all 0.15s}
.sq-chip:hover{background:rgba(10,132,255,0.1);border-color:rgba(10,132,255,0.3);color:#0a84ff}

.d-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.sst{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:6px}
.si{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;font-size:11px;color:#aaa;cursor:pointer;transition:all 0.15s;margin-bottom:1px}
.si:hover{background:rgba(255,255,255,0.05);color:#fff}
.si.on{background:rgba(10,132,255,0.12);color:#0a84ff}
.si .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.si svg{width:12px;height:12px;flex-shrink:0;opacity:0.6}
.d-panels{flex:1;overflow-y:auto;padding:16px 20px}
.d-panels::-webkit-scrollbar{width:3px}
.d-panels::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dh h2{font-size:16px;font-weight:700;color:#fff}
.dh-t{margin-left:auto;font-size:11px;color:#666}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.dc{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px;backdrop-filter:blur(8px)}
.dc.full{grid-column:1/-1}
.dct{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dct svg{width:12px;height:12px}
.dab{border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.dab-b{background:rgba(10,132,255,0.06);border:1px solid rgba(10,132,255,0.15)}
.dab-g{background:rgba(48,209,88,0.06);border:1px solid rgba(48,209,88,0.15)}
.dab-c{flex:1}
.dab-t{font-size:11px;font-weight:600;margin-bottom:4px}
.dab-tb{color:#0a84ff}
.dab-tg{color:#30d158}
.dab-d{font-size:11px;color:#ccc;line-height:1.6}
.d-chart{height:80px;background:rgba(255,255,255,0.02);border-radius:8px;overflow:hidden;margin:6px 0}
.das{display:flex;gap:8px;margin:12px 0}
.dbtn{padding:8px 16px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s}
.dbtn-p{background:#0a84ff;color:#fff}
.dbtn-s{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid rgba(255,255,255,0.1)}
.dbtn:hover{filter:brightness(1.15)}
.tr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.tr:last-child{border:none}
.ts{font-size:11px;color:#ccc;width:120px;flex-shrink:0}
.tbw{flex:1;height:16px;background:rgba(255,255,255,0.04);border-radius:4px;position:relative;overflow:hidden}
.tb{height:100%;border-radius:4px;position:absolute;left:0;top:0}
.tb-ok{background:rgba(48,209,88,0.4)}.tb-er{background:rgba(255,59,48,0.4)}
.tms{font-size:10px;color:#888;width:50px;text-align:right;flex-shrink:0}
.code{background:#0d0d12;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;font-family:'SF Mono',Menlo,monospace;font-size:10.5px;line-height:1.7;overflow-x:auto;margin:6px 0}
.code .ln{color:#444;user-select:none;display:inline-block;width:28px}
.code .hll{background:rgba(255,59,48,0.1);display:block;margin:0 -12px;padding:0 12px;border-left:2px solid #ff3b30}
.kw{color:#c678dd}.str{color:#98c379}.fn{color:#61afef}.cm{color:#5c6370}
.chain-n{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#ccc}
.chain-n .num{color:#ff9500;font-weight:700;width:16px}
.chain-n .num-r{color:#ff3b30}
.err-box{font-size:10px;color:#ff6b6b;margin-top:8px;padding:6px 8px;background:rgba(255,59,48,0.08);border-radius:6px}
</style>
