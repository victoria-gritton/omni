<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya 2AM Incident - CloudWatch AI Experience</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:#0a0e1a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;padding:14px 24px;gap:6px}
.nav-btn{padding:10px 22px;border-radius:24px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.3s;background:transparent;color:#888;display:inline-flex;align-items:center;gap:6px}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-btn.active{background:#ff9500;color:#000;font-weight:600}
.nav-btn svg{width:14px;height:14px}
.scene{display:none;padding-top:80px;min-height:100vh;flex-direction:column;align-items:center}
.scene.active{display:flex}
.ctx{text-align:center;padding:16px 20px;max-width:520px;line-height:1.6}
.ctx .time{color:#ff9500;font-weight:600;font-size:15px;display:block;margin-bottom:4px}
.ctx .nar{color:#777;font-size:13px;font-style:italic}
.steps{display:flex;gap:6px;margin:12px 0 8px;justify-content:center}
.step{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#888;font-size:11px;cursor:pointer;transition:all 0.2s}
.step:hover{background:rgba(255,255,255,0.08);color:#ccc}
.step.on{background:rgba(255,149,0,0.15);border-color:#ff9500;color:#ff9500}
.wrap{position:relative;margin:16px 0 24px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.4s ease both}
</style>
<style>
/* WATCH with SVG mockup */
.watch-wrap{position:relative;width:330px;height:495px}
.watch-svg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.watch-screen{position:absolute;top:102px;left:36px;right:36px;bottom:102px;border-radius:30px;overflow:hidden;background:#000;z-index:3}
.ws{width:100%;height:100%;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.ws::-webkit-scrollbar{display:none}
/* Notification face */
.wn-face{height:100%;display:flex;flex-direction:column}
.wn-time{font-size:51px;font-weight:200;color:#fff;text-align:center;padding-top:15px;letter-spacing:-1px}
.wn-date{font-size:12px;color:#555;text-align:center;margin-top:0;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px}
.wn-banner{margin:0 12px;background:rgba(255,59,48,0.1);border:1px solid rgba(255,59,48,0.18);border-radius:18px;padding:13px;cursor:pointer;transition:all 0.15s}
.wn-banner:hover{background:rgba(255,59,48,0.2);transform:scale(1.02)}
.wn-hdr{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.wn-icon{width:27px;height:27px;border-radius:7px;background:linear-gradient(135deg,#ff9500,#ff6b00);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wn-icon svg{width:15px;height:15px}
.wn-app{font-size:12px;color:#ff9500;font-weight:600;text-transform:uppercase;letter-spacing:0.4px}
.wn-when{font-size:10px;color:#555;margin-left:auto}
.wn-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:3px}
.wn-body{font-size:13px;color:#999;line-height:1.35}
.wn-body strong{color:#ff6b6b;font-weight:600}
.wn-spark{margin-top:7px;height:30px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,0.02)}
/* Alert detail */
.wa-pad{padding:12px 15px 18px}
.wa-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.wa-top .dot{width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1.5s infinite}
.wa-top span{font-size:12px;font-weight:600;color:#ff6b6b;letter-spacing:0.3px}
.wt{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.wm{font-size:13px;color:#bbb;line-height:1.4;margin-bottom:7px}
.wm strong{color:#ff9500}
.red{color:#ff3b30}.ylw{color:#ff9500}.grn{color:#30d158}
/* Gauge */
.w-gauge{display:flex;align-items:center;justify-content:space-around;margin:6px 6px 9px}
.w-gr{position:relative;width:66px;height:66px}
.w-gr svg{width:66px;height:66px;transform:rotate(-90deg)}
.w-gr .bg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:4}
.w-gr .fg{fill:none;stroke-width:4;stroke-linecap:round}
.w-gv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1}
.w-gv .n{font-size:16px;font-weight:700;display:block}
.w-gv .l{font-size:7px;color:#888;text-transform:uppercase;letter-spacing:0.2px;display:block;margin-top:2px}
/* Mini chart */
.w-mc{height:42px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,0.02);margin-bottom:7px}
/* Stats */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:7px}
.wgs{background:rgba(255,255,255,0.04);border-radius:7px;padding:6px;text-align:center}
.wgs .vl{font-size:8px;color:#666;text-transform:uppercase;letter-spacing:0.3px}
.wgs .vv{font-size:15px;font-weight:700;margin-top:2px}

        <div class="ac">
          <div class="ah"><div class="av"><svg><use href="#ic-search"/></svg></div><span class="an">Root Cause Analysis</span></div>
          <div class="ax">
            <strong>Deploy #847</strong> landed at 01:45 AM. The new code references a DynamoDB table called <span class="er">PaymentsTable-v2</span>. That table <strong>doesn't exist</strong> in this account.<br><br>
            The old table <span class="hl">PaymentsTable</span> is healthy -- the new code just isn't pointing to it.<br><br>
            <strong>Who deployed:</strong> Raj Patel merged at 5:47 PM yesterday. The commit changed the table reference as part of migration work, but the Terraform change to create the new table hasn't been applied yet.<br><br>
            <strong>Customer impact:</strong> Customers hitting checkout see "payment failed, please retry." No money was taken incorrectly. All failures are retryable.
          </div>
        </div>

        \x3C!-- Conversation -->
        <div class="ub">Are any customers actually affected right now?</div>
        <div class="ac"><div class="ah"><div class="av"><svg><use href="#ic-agent"/></svg></div><span class="an">CloudWatch Agent</span></div>
          <div class="ax">Yes. <strong>847 payment attempts</strong> failed in the last 18 minutes. No duplicate charges detected. All failures returned clean 500 errors -- <span class="hl">retryable on the client side</span>. No data corruption risk.</div></div>

        <div class="ub">Is the v2 table supposed to exist?</div>
        <div class="ac"><div class="ah"><div class="av"><svg><use href="#ic-agent"/></svg></div><span class="an">CloudWatch Agent</span></div>
          <div class="ax">There's a <strong>Terraform change in the pipeline</strong> to create PaymentsTable-v2, but it hasn't been applied yet. The code change shipped before the infrastructure change. This is a sequencing issue -- not a bug in the code itself.</div></div>

        <div class="ub">Should I roll back or wait for the table to be created?</div>
        <div class="ac"><div class="ah"><div class="av"><svg><use href="#ic-agent"/></svg></div><span class="an">CloudWatch Agent</span></div>
          <div class="ax">I recommend <strong>rolling back now</strong>. The Terraform apply requires approvals and could take 15+ minutes. Every minute the current deploy is live, ~45 more payments fail. Rolling back to deploy #846 will restore the working table reference immediately.</div></div>

        \x3C!-- Actions -->

        <div class="pa"><button class="pb" onclick="doRollback()"><div class="pi pi-b"><svg stroke="#0a84ff"><use href="#ic-rewind"/></svg></div><div><div class="pt">Roll back deploy #847</div><div class="pu" id="rb-status">Restore deploy #846 -- immediate fix</div></div></button></div>
